name: Site External Link Check

on:
  schedule:
    - cron: "30 9 * * 1" # Monday 09:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: External link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter @pearl/site build

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --exclude-mail
            --timeout 30
            --max-retries 3
            --base packages/site/dist
            --exclude-path packages/site/dist/pagefind
            packages/site/dist
          fail: false
          output: /tmp/lychee-report.md

      - name: Open issue on failures
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: "Broken external links found on marketing site"
          content-filepath: /tmp/lychee-report.md
          labels: site, links, automated
