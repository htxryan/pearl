name: Site External Link Check

on:
  schedule:
    - cron: "30 9 * * 1" # Monday 09:30 UTC
  workflow_dispatch:

jobs:
  check:
    name: External link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter @pearl/site build

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --exclude-mail
            --timeout 30
            --max-retries 3
            --base packages/site/dist
            --exclude-path packages/site/dist/pagefind
            packages/site/dist
          fail: false
          output: /tmp/lychee-report.md

      - name: Open issue on failures
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken external links found on marketing site"
          content-filepath: /tmp/lychee-report.md
          labels: site, links, automated
