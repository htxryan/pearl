name: Site CI

on:
  push:
    branches: [main]
    paths:
      - "packages/site/**"
      - "docs/specs/headers-golden.txt"
      - ".github/workflows/site-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/site/**"
      - "docs/specs/headers-golden.txt"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter @pearl/site build

      - name: Cache site build
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: packages/site/dist
          key: site-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/site/src/**', 'packages/site/astro.config.ts', 'packages/site/public/**') }}

  headers:
    name: Security headers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Restore site build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: packages/site/dist
          key: site-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/site/src/**', 'packages/site/astro.config.ts', 'packages/site/public/**') }}
          fail-on-cache-miss: true

      - name: Verify _headers matches golden file
        run: diff -u docs/specs/headers-golden.txt packages/site/dist/_headers

  pagefind:
    name: Pagefind integrity
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Restore site build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: packages/site/dist
          key: site-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/site/src/**', 'packages/site/astro.config.ts', 'packages/site/public/**') }}
          fail-on-cache-miss: true

      - name: Assert Pagefind index exists
        run: |
          if [ ! -d packages/site/dist/pagefind ]; then
            echo "::error::Pagefind directory missing from build output"
            exit 1
          fi

      - name: Assert Pagefind has entries
        run: |
          if [ ! -f packages/site/dist/pagefind/pagefind-entry.json ]; then
            echo "::error::pagefind-entry.json missing"
            exit 1
          fi
          PAGE_COUNT=$(python3 -c "
          import json, sys
          d = json.load(open('packages/site/dist/pagefind/pagefind-entry.json'))
          total = sum(lang.get('page_count', 0) for lang in d.get('languages', {}).values())
          print(total)
          sys.exit(0 if total >= 1 else 1)
          ")
          echo "Pagefind page count: $PAGE_COUNT"
          FRAG_COUNT=$(find packages/site/dist/pagefind/fragment/ -mindepth 1 -maxdepth 1 2>/dev/null | wc -l)
          echo "Fragment file count: $FRAG_COUNT"
          if [ "$FRAG_COUNT" -lt 1 ]; then
            echo "::error::Pagefind index has no fragment files"
            exit 1
          fi

  links-internal:
    name: Internal link check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Restore site build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: packages/site/dist
          key: site-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/site/src/**', 'packages/site/astro.config.ts', 'packages/site/public/**') }}
          fail-on-cache-miss: true

      - name: Check internal links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/packages/site/dist
            --include-fragments
            packages/site/dist
          fail: true

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore site build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: packages/site/dist
          key: site-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/site/src/**', 'packages/site/astro.config.ts', 'packages/site/public/**') }}
          fail-on-cache-miss: true

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: lhci autorun --config=packages/site/lighthouserc.cjs
