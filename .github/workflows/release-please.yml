name: Release Please

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs['packages/pearl-bdui--release_created'] }}
      version: ${{ steps.release.outputs['packages/pearl-bdui--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6.0.4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build & publish
        working-directory: packages/pearl-bdui
        run: npm publish

  smoke-test:
    name: Smoke Test Published Package
    needs: [publish, release-please]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Wait for npm propagation
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          echo "Waiting for pearl-bdui@${VERSION} to appear on npm..."
          for _ in $(seq 1 30); do
            if npm view "pearl-bdui@${VERSION}" version 2>/dev/null; then
              echo "Package available on npm"
              exit 0
            fi
            sleep 10
          done
          echo "::error::pearl-bdui@${VERSION} not available on npm after 5 minutes"
          exit 1

      - name: Install published package
        run: npm install -g "pearl-bdui@${{ needs.release-please.outputs.version }}"

      - name: Verify CLI version
        run: pearl-bdui --version

      - name: Verify server starts and health endpoint responds
        run: |
          pearl-bdui --no-open &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3456/api/health > /tmp/health.json 2>/dev/null; then
              echo "Health check passed:"
              cat /tmp/health.json
              kill $SERVER_PID 2>/dev/null || true
              wait $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server failed to respond to health check within 30 seconds"
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          exit 1

      - name: Create GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Smoke test failed for pearl-bdui@${VERSION} on ${{ matrix.os }}" \
            --body "The post-publish smoke test failed for \`pearl-bdui@${VERSION}\` on \`${{ matrix.os }}\`.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The published package may be broken. Investigate and publish a patch if needed." \
            --label "bug" || true
