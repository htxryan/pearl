name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @pearl/shared run build

      - name: Cache workspace
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Restore workspace
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}
          restore-keys: |
            workspace-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pearl/shared run build

      - run: pnpm lint
      - run: pnpm lint:lucide
      - run: pnpm lint:invariants

  lint-deps:
    name: Dependency boundaries
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Restore workspace
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}
          restore-keys: |
            workspace-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pearl/shared run build

      - run: pnpm lint:deps

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Restore workspace
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}
          restore-keys: |
            workspace-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pearl/shared run build

      - run: pnpm typecheck

  type-contract:
    name: Shared type contract
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Restore workspace
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}
          restore-keys: |
            workspace-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Rebuild @pearl/shared
        run: pnpm --filter @pearl/shared run build

      - name: Verify shared dist is up to date
        run: git diff --exit-code packages/shared/dist/

  audit:
    name: Dependency audit
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Restore workspace
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}
          restore-keys: |
            workspace-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (production deps, fail on high+)
        run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # gitleaks-action computes a diff range internally and resolves the
          # parent of the first commit in the range, so PR runs need history
          # beyond the merge commit. Push runs scan all of main. fetch-depth: 0
          # is the configuration recommended by gitleaks-action's README.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Required by gitleaks-action v2 to scan PRs (resolves the
          # "GITHUB_TOKEN is now required to scan pull requests" error).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install actionlint
        id: install
        # Install pinned binary from a tagged release with sha256 verification.
        # Pinning the version + checksum prevents supply-chain compromise of the
        # installer script or binary (CI hardening — beads-gui-0694).
        run: |
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          echo "path=/tmp/actionlint" >> "$GITHUB_OUTPUT"

      - name: Run actionlint
        run: ${{ steps.install.outputs.path }} -color

  test:
    name: Test
    needs: [install, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Restore build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
            packages/pearl-bdui/dist
            packages/frontend/dist
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/**/src/**', 'packages/**/tsconfig.json', '.nvmrc') }}
          fail-on-cache-miss: true

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        if: ${{ !cancelled() }}
        with:
          files: ./packages/shared/coverage/lcov.info,./packages/pearl-bdui/coverage/lcov.info,./packages/frontend/coverage/lcov.info
          flags: shared,pearl-bdui,frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Restore workspace
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}
          restore-keys: |
            workspace-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Cache build output
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
            packages/pearl-bdui/dist
            packages/frontend/dist
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/**/src/**', 'packages/**/tsconfig.json', '.nvmrc') }}

  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/3)
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Restore build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
            packages/pearl-bdui/dist
            packages/frontend/dist
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/**/src/**', 'packages/**/tsconfig.json', '.nvmrc') }}
          fail-on-cache-miss: true

      - name: Install Dolt
        run: |
          DOLT_VERSION="1.85.0"
          curl -Lo /tmp/install-dolt.sh "https://github.com/dolthub/dolt/releases/download/v${DOLT_VERSION}/install.sh"
          echo "Verifying Dolt install script..."
          sudo bash /tmp/install-dolt.sh
          dolt version

      - name: Install beads (bd CLI)
        run: |
          BD_VERSION="1.0.0"
          curl -sL "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz" -o /tmp/beads.tar.gz
          tar xz -C /usr/local/bin bd < /tmp/beads.tar.gz
          bd version

      - name: Seed E2E database
        run: bash e2e/setup-db.sh

      - name: Install Playwright (browsers + system deps)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-failure-artifacts-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e-primitives:
    name: E2E Primitive Snapshots
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Restore build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
            packages/pearl-bdui/dist
            packages/frontend/dist
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/**/src/**', 'packages/**/tsconfig.json', '.nvmrc') }}
          fail-on-cache-miss: true

      - name: Install Playwright (browsers + system deps)
        run: npx playwright install --with-deps chromium

      - name: Run primitive E2E tests
        run: pnpm --filter @pearl/frontend test:e2e
        working-directory: ${{ github.workspace }}

      - name: Upload primitive snapshot report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: primitive-playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 14

      - name: Upload primitive failure artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: primitive-test-failure-artifacts
          path: packages/frontend/test-results/
          retention-days: 7
