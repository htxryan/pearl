<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Polish 2 — Proof Showcase</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d11;
        --panel: #14181f;
        --panel-2: #1a1f28;
        --border: #232a36;
        --text: #e7ecf3;
        --muted: #8a93a6;
        --accent: #6c8aff;
        --ok: #3ec27a;
        --warn: #e8b347;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        background: linear-gradient(180deg, rgba(11, 13, 17, 0.95), rgba(11, 13, 17, 0.6));
        z-index: 10;
      }
      .title {
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      .title .muted {
        color: var(--muted);
        font-weight: 400;
      }
      .counter {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 13px;
      }
      .progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        background: var(--accent);
        transition: width 0.18s ease-out;
        z-index: 11;
      }
      main {
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr minmax(320px, 380px);
        gap: 0;
      }
      .stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 24px 80px;
        background: radial-gradient(circle at 50% 40%, #15191f 0%, #0b0d11 70%);
      }
      .stage img {
        max-width: 100%;
        max-height: 100%;
        border-radius: 8px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border);
        user-select: none;
        -webkit-user-drag: none;
      }
      .nav-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 25%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.2s;
        font-size: 36px;
        color: var(--muted);
      }
      .nav-zone:hover {
        opacity: 0.9;
      }
      .nav-zone.left {
        left: 0;
      }
      .nav-zone.right {
        right: 0;
      }
      aside {
        background: var(--panel);
        border-left: 1px solid var(--border);
        padding: 64px 24px 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        width: fit-content;
      }
      .badge.ok::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
      }
      h1 {
        margin: 0;
        font-size: 19px;
        line-height: 1.3;
        font-weight: 600;
      }
      .summary {
        color: var(--muted);
        font-size: 13.5px;
      }
      .section {
        margin-top: 6px;
      }
      .section h2 {
        margin: 0 0 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 600;
      }
      .section ul {
        margin: 0;
        padding-left: 18px;
      }
      .section li {
        margin-bottom: 4px;
      }
      .file {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        color: var(--muted);
        word-break: break-all;
      }
      .toolbar {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 8px;
        z-index: 12;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .toolbar button {
        background: transparent;
        border: 0;
        color: var(--text);
        cursor: pointer;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-family: inherit;
      }
      .toolbar button:hover {
        background: var(--panel-2);
      }
      .kbd {
        display: inline-block;
        padding: 1px 6px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        border-radius: 4px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .obs {
        margin-top: 12px;
        padding: 10px 12px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .obs strong {
        color: var(--warn);
        font-weight: 600;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--border);
          padding-top: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="progress" class="progress" style="width: 0%"></div>
    <header>
      <div class="title">
        Polish 2 — Proof Showcase
        <span class="muted">· beads-gui-g2c0</span>
      </div>
      <div class="counter"><span id="idx">1</span> / <span id="total">0</span></div>
    </header>
    <main>
      <div class="stage">
        <div class="nav-zone left" id="prevZone">‹</div>
        <img id="img" alt="" />
        <div class="nav-zone right" id="nextZone">›</div>
      </div>
      <aside>
        <span id="badge" class="badge ok">verified</span>
        <h1 id="heading">—</h1>
        <p class="summary" id="summary">—</p>
        <div class="section">
          <h2>What this proves</h2>
          <ul id="proves"></ul>
        </div>
        <div class="section" id="anomalySection" hidden>
          <div class="obs" id="anomaly"></div>
        </div>
        <div class="file" id="file">—</div>
      </aside>
    </main>
    <div class="toolbar">
      <button id="btnPrev" title="Previous">‹ Prev</button>
      <span class="kbd">←</span>
      <span class="kbd">→</span>
      <button id="btnNext" title="Next">Next ›</button>
    </div>
    <script>
      const slides = [
        {
          file: "g2c0.2-attachments.png",
          bead: "g2c0.2",
          title: "Attachments fail to load — fixed",
          summary:
            "On beads-gui-8uah the inline attachment refs and ATTACHMENTS gallery render correctly again. The fix restored missing files on disk that orphan-sweep had removed.",
          proves: [
            "Inline attachment ref pills render as indigo bubbles, not red error icons",
            "ATTACHMENTS (3) section appears with cards, no 'Failed to load attachment ref=…' messages",
            "/api/attachments/<ref> returns 200 again (not 404)",
          ],
        },
        {
          file: "g2c0.13-modal-content-width.png",
          bead: "g2c0.13",
          title: "Issue modal main content fills width",
          summary:
            "Switching the side panel to modal view shows the issue at full-page width. The Description, Notes, and Attachments column expands to fill the available horizontal space instead of being capped by max-w-4xl.",
          proves: [
            "Description column extends to the metadata sidebar (no wasted gutter)",
            "Long lines wrap at the natural width, not at an arbitrary 4xl cap",
            "Metadata sidebar stays a fixed comfortable width on the right",
          ],
        },
        {
          file: "g2c0.1-side-panel-default.png",
          bead: "g2c0.1",
          title: "Resizable side panel — default width",
          summary:
            "Baseline shot of the side panel at its default width (~440px). The fix introduces a draggable left edge with localStorage persistence, min 300px / max 800px clamps, and keyboard nudging.",
          proves: [
            "Panel renders at the default width when no preference is stored",
            "Resize handle (separator role) is present on the left edge",
            "List area to the left, panel area to the right are cleanly separated",
          ],
        },
        {
          file: "g2c0.1-3-side-panel-narrow.png",
          bead: "g2c0.1 + g2c0.3",
          title: "Narrow panel + FIELDS don't overflow",
          summary:
            "With detailPanel.width set to 360px in localStorage, the panel renders at the persisted narrow width AND the FIELDS column inside it renders cleanly — no value clipping, no overflow.",
          proves: [
            "Persisted panel width (detailPanel.width localStorage key) is honored on load",
            "Owner email 'htxryan@gmail.com' displays in full — no truncation at narrow widths",
            "Labels search input, Date picker trigger, Priority/Status/Type selects all stay inside the panel",
          ],
        },
        {
          file: "g2c0.4-labels-combobox-open.png",
          bead: "g2c0.4",
          title: "Labels combobox — clean focus ring",
          summary:
            "Clicking 'Search labels…' opens the combobox dropdown with one clean focus ring (no double / offset ring). Options populate from the project's labels with usage counts.",
          proves: [
            "Single focus ring on the input — matches the rest of the app's shadcn+BaseUI inputs",
            "Dropdown anchors correctly to the input",
            "Options render with usage counts (attachments 13, epic-series 12, …)",
          ],
          anomaly:
            "Worth filing as a follow-up: the 'No matching labels' empty-state message appears at the bottom of the dropdown alongside the populated label list. The empty state should only show when there are zero matches.",
        },
        {
          file: "g2c0.4-labels-combobox-arrow-nav.png",
          bead: "g2c0.4",
          title: "Labels combobox — keyboard navigation",
          summary:
            "After two ArrowDown presses, 'epic-series' is highlighted (indigo background). The previous bug had no keyboard navigation at all — only mouse selection worked.",
          proves: [
            "ArrowDown moves the active option; visual highlight follows",
            "Active option uses indigo background to indicate keyboard focus",
            "Component now sits on the shared shadcn+BaseUI Combobox primitive",
          ],
        },
        {
          file: "g2c0.6-priority-dropdown-anchor.png",
          bead: "g2c0.6",
          title: "Top-bar Priority filter — anchored",
          summary:
            "The Priority filter dropdown opens directly under its trigger button (P0/P1/P2/P3/P4 stacked). Previously the popover was offset left/up and visually detached from the chevron.",
          proves: [
            "Popover anchors to the bottom-edge of its trigger (no horizontal/vertical drift)",
            "All 5 priority levels (P0–P4) render in order",
            "Behavior is consistent with other top-bar filter dropdowns",
          ],
        },
        {
          file: "g2c0.8-search-modal-default.png",
          bead: "g2c0.8",
          title: "Search modal — bounded at default viewport",
          summary:
            "Cmd+F opens the search palette with 'Search issues…' input and a Recent Issues list. The modal is centered and capped to a fraction of the viewport, with the inner list scrolling within.",
          proves: [
            "Modal is centered and bounded — does not extend beyond the viewport",
            "Recent Issues list shows the loop's outputs (g2c0.5, .9, .10, .12, .14, .15, .16, .7)",
            "Mirrors the previously-fixed command palette modal",
          ],
        },
        {
          file: "g2c0.8-search-modal-short-viewport.png",
          bead: "g2c0.8",
          title: "Search modal — bounded at 600px-tall viewport",
          summary:
            "After resizing to 1440×600, the modal still fits inside the viewport. The inner Recent Issues list scrolls independently while the modal frame stays bounded.",
          proves: [
            "Modal max-height respects the available viewport height",
            "Inner list scrolls; modal chrome (input, header) stays pinned",
            "No content extends below the viewport — the original bug",
          ],
        },
        {
          file: "g2c0.11-board-default.png",
          bead: "g2c0.11",
          title: "Board view — per-column 'Modified' sort",
          summary:
            "Each column (Open / In Progress / Closed / Deferred) has its own sort dropdown set to 'Modified'. Cards in the Open column are ordered by modified_at descending — most-recently-modified at top.",
          proves: [
            "Per-column sort dropdown is functional and persists per column",
            "Cards order by modified_at descending within the column",
            "Board sort is decoupled from the URL ?sort/?dir params (which control list view)",
          ],
        },
        {
          file: "g2c0.5-date-picker-open.png",
          bead: "g2c0.5",
          title: "Date picker — chevrons no longer overlap input",
          summary:
            "Opening the FIELDS Set date trigger shows the calendar with chevrons on the same row as 'April 2026'. The natural-language input ('e.g. tomorrow, next friday, in 2 weeks') sits cleanly above on its own row.",
          proves: [
            "Prev (‹) and next (›) chevrons are aligned with the month/year header",
            "Natural-language input is on a separate row above the chevrons",
            "Hover/focus on chevrons no longer collides with the input's focus ring",
          ],
        },
        {
          file: "g2c0.9-create-issue-modal.png",
          bead: "g2c0.9",
          title: "Create Issue modal — wider + taller textarea",
          summary:
            "The Create Issue modal is now ~50% wider and the Description textarea defaults to ~2× its previous height — enough room to draft a real issue without manually resizing.",
          proves: [
            "Modal width increased ~50% from the previous size token",
            "Description textarea defaults to roughly 2× the prior height",
            "Two-column layout (Type/Priority and Assignee/Due Date) reflows cleanly at the new width",
          ],
        },
        {
          file: "g2c0.10-toast-on-create.png",
          bead: "g2c0.10",
          title: "Toast on create — with linkable BeadId",
          summary:
            "Submitting a Create Issue dialog now shows a bottom-right toast: '✓ Issue created: <BeadId pill>'. The pill uses the project's standard BeadId component so it inherits clickable / copyable behavior.",
          proves: [
            "Toast appears after successful create",
            "Toast renders the new issue ID via the BeadId pill (copy icon, link target)",
            "New issue (efbj / 6zl2) is visible in the list at row 'just now'",
          ],
        },
        {
          file: "g2c0.12-list-column-order.png",
          bead: "g2c0.12",
          title: "List view — default column order",
          summary:
            "With column-order localStorage cleared, the default list column order is now: ID, TYPE, TITLE, STATUS, then the existing order for the rest (PRIORITY, ASSIGNEE, CREATED, DUE, LABELS).",
          proves: [
            "Default order: ID → TYPE → TITLE → STATUS → PRIORITY → … (matches the spec)",
            "Users with persisted custom orderings are unaffected (only the factory default changed)",
            "Column drag/reorder still works as before",
          ],
        },
      ];

      const $img = document.getElementById("img");
      const $idx = document.getElementById("idx");
      const $total = document.getElementById("total");
      const $heading = document.getElementById("heading");
      const $summary = document.getElementById("summary");
      const $proves = document.getElementById("proves");
      const $file = document.getElementById("file");
      const $progress = document.getElementById("progress");
      const $anomalySection = document.getElementById("anomalySection");
      const $anomaly = document.getElementById("anomaly");

      let i = 0;
      $total.textContent = String(slides.length);

      function render() {
        const s = slides[i];
        $img.src = s.file;
        $img.alt = s.title;
        $idx.textContent = String(i + 1);
        $heading.textContent = `${s.bead} · ${s.title}`;
        $summary.textContent = s.summary;
        $proves.innerHTML = s.proves.map((p) => `<li>${p}</li>`).join("");
        $file.textContent = s.file;
        $progress.style.width = `${((i + 1) / slides.length) * 100}%`;
        if (s.anomaly) {
          $anomalySection.hidden = false;
          $anomaly.innerHTML = `<strong>Note:</strong> ${s.anomaly}`;
        } else {
          $anomalySection.hidden = true;
        }
        history.replaceState(null, "", `#${i + 1}`);
      }

      function go(delta) {
        i = (i + delta + slides.length) % slides.length;
        render();
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "h") go(-1);
        else if (e.key === "ArrowRight" || e.key === "l" || e.key === " ") go(1);
        else if (e.key === "Home") {
          i = 0;
          render();
        } else if (e.key === "End") {
          i = slides.length - 1;
          render();
        }
      });

      document.getElementById("btnPrev").addEventListener("click", () => go(-1));
      document.getElementById("btnNext").addEventListener("click", () => go(1));
      document.getElementById("prevZone").addEventListener("click", () => go(-1));
      document.getElementById("nextZone").addEventListener("click", () => go(1));

      // deep-link via #N
      const m = location.hash.match(/#(\d+)/);
      if (m) {
        const n = parseInt(m[1], 10);
        if (n >= 1 && n <= slides.length) i = n - 1;
      }
      render();
    </script>
  </body>
</html>
